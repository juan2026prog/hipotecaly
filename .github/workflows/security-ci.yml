name: Security & Quality CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Analysis
        run: npx tsc --noEmit

      - name: Production Build Verification
        run: npm run build

      - name: Supply Chain Dependency Audit
        run: npm audit --audit-level=critical

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Automated Security & RLS Test Suites
        run: |
          npx playwright test tests/adversarial-security-hardening.spec.ts tests/fintech-security-hardening.spec.ts tests/security-mock-bypass-attack.spec.ts tests/rls-security.spec.ts
